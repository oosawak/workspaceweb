<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ソンソン風ゲーム</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: #071018;
    color: #fff;
    font-family: system-ui, -apple-system, Arial, sans-serif;
    overflow: hidden;
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #hud {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #0c1a28;
    border-bottom: 1px solid #1b2a3a;
  }

  #hud .score {
    font-weight: 700;
  }

  button {
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
    background: #2563eb;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  #game {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: block;
    touch-action: none;
    background: linear-gradient(#071018, #0b1724);
  }

  #help {
    padding: 8px 12px;
    font-size: 13px;
    color: #9fb0c3;
    background: #0c1a28;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div>Score <span id="score">0</span></div>
    <div>Best <span id="best">0</span></div>
    <button id="restart">リスタート</button>
  </div>

  <canvas id="game"></canvas>

  <div id="help">
    ←/→ または A/D、Space: スタート/リスタート。スマホ: 画面をタップ/スライド。
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const restartBtn = document.getElementById('restart');

let W = 320;
let H = 480;

let state = 'ready'; // ready, playing, over
let score = 0;
let best = loadBest();
bestEl.textContent = best;

const player = {
  x: 160,
  y: 420,
  size: 34,
  speed: 280
};

let items = [];
let spawnTimer = 0.6;
let lastTime = 0;

let keys = {
  left: false,
  right: false
};

let pointerActive = false;
let pointerX = 0;

function loadBest() {
  try {
    return Number(localStorage.getItem('sonsun_best')) || 0;
  } catch (e) {
    return 0;
  }
}

function saveBest(v) {
  try {
    localStorage.setItem('sonsun_best', String(v));
  } catch (e) {
    // 保存できない環境では無視
  }
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  W = rect.width;
  H = rect.height;

  player.y = H - 44;

  if (!player.x || player.x < 0) {
    player.x = W / 2;
  }

  player.x = Math.max(player.size / 2, Math.min(W - player.size / 2, player.x));
}

function reset() {
  score = 0;
  items = [];
  spawnTimer = 0.6;
  player.x = W / 2;
  player.y = H - 44;
  scoreEl.textContent = 0;
}

function startGame() {
  if (state === 'over') {
    reset();
  }
  state = 'playing';
  spawnTimer = 0.6;
}

function endGame() {
  state = 'over';

  const s = Math.floor(score);
  if (s > best) {
    best = s;
    bestEl.textContent = best;
    saveBest(best);
  }
}

function spawnItem() {
  const size = 18 + Math.random() * 20;
  const x = size / 2 + Math.random() * Math.max(1, W - size);
  const speed = 130 + score * 0.4 + Math.random() * 60;
  const type = Math.random() < 0.34 ? 'star' : 'bomb';

  items.push({
    x,
    y: -size,
    size,
    speed,
    type,
    rot: Math.random() * Math.PI * 2
  });
}

function update(dt) {
  if (state !== 'playing') return;

  score += dt * 9;

  if (pointerActive) {
    player.x += (pointerX - player.x) * Math.min(1, dt * 12);
  } else {
    if (keys.left) player.x -= player.speed * dt;
    if (keys.right) player.x += player.speed * dt;
  }

  player.x = Math.max(player.size / 2, Math.min(W - player.size / 2, player.x));
  player.y = H - 44;

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnItem();
    const interval = Math.max(0.20, 0.80 - score * 0.0011);
    spawnTimer = interval;
  }

  const ps = player.size / 2;

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];

    it.y += it.speed * dt;
    it.rot += dt * 2;

    if (it.y > H + it.size) {
      items.splice(i, 1);
      continue;
    }

    const is = it.size / 2;

    if (
      Math.abs(player.x - it.x) < ps + is &&
      Math.abs(player.y - it.y) < ps + is
    ) {
      if (it.type === 'star') {
        score += 15;
        items.splice(i, 1);
      } else {
        endGame();
        return;
      }
    }
  }

  const s = Math.floor(score);
  scoreEl.textContent = s;

  if (s > best) {
    best = s;
    bestEl.textContent = best;
    saveBest(best);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);

  ctx.fillStyle = '#38bdf8';
  roundRect(-17, -17, 34, 34, 9);
  ctx.fill();

  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(-7, -3, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(7, -3, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 6, 6, 0, Math.PI);
  ctx.stroke();

  ctx.restore();
}

function drawBomb(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(it.rot);

  ctx.fillStyle = '#ef4444';
  roundRect(-it.size / 2, -it.size / 2, it.size, it.size, 6);
  ctx.fill();

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-it.size / 4, -it.size / 4);
  ctx.lineTo(it.size / 4, it.size / 4);
  ctx.moveTo(it.size / 4, -it.size / 4);
  ctx.lineTo(-it.size / 4, it.size / 4);
  ctx.stroke();

  ctx.restore();
}

function drawStar(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(it.rot * 0.5);

  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();

  const r = it.size / 2;

  for (let i = 0; i < 10; i++) {
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    const x = Math.cos(angle) * rr;
    const y = Math.sin(angle) * rr;

    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }

  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawText(text, y, size, weight, color) {
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px system-ui, -apple-system, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 背景グリッド
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;

  for (let x = 0; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // 地面
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, H - 24, W, 24);

  // 落ちてくるもの
  for (const it of items) {
    if (it.type === 'star') {
      drawStar(it);
    } else {
      drawBomb(it);
    }
  }

  // プレイヤー
  drawPlayer();

  // スタート画面
  if (state === 'ready') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);

    drawText('SONSUN風', 40, 34, 700, '#fff');
    drawText('黄色を拾い、赤を避けよう', H / 2 - 10, 18, 700, '#fff');
    drawText('タップ / Space でスタート', H / 2 + 24, 16, 400, '#cbd5e1');
  }

  // ゲームオーバー画面
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);

    drawText('GAME OVER', H / 2 - 30, 34, 700, '#f87171');
    drawText(`Score ${Math.floor(score)}`, H / 2 + 6, 22, 700, '#fff');
    drawText('タップ / Space でリスタート', H / 2 + 42, 16, 400, '#cbd5e1');
  }
}

function frame(t) {
  if (!lastTime) {
    lastTime = t;
  }

  const dt = Math.min(0.05, (t - lastTime) / 1000);
  lastTime = t;

  update(dt);
  draw();

  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    keys.left = true;
  }

  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    keys.right = true;
  }

  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();

    if (state === 'ready' || state === 'over') {
      startGame();
    }
  }
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    keys.left = false;
  }

  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    keys.right = false;
  }
});

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();

  const rect = canvas.getBoundingClientRect();
  pointerActive = true;
  pointerX = e.clientX - rect.left;

  if (state === 'ready' || state === 'over') {
    startGame();
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointerActive) return;

  const rect = canvas.getBoundingClientRect();
  pointerX = e.clientX - rect.left;
});

canvas.addEventListener('pointerup', () => {
  pointerActive = false;
});

canvas.addEventListener('pointercancel', () => {
  pointerActive = false;
});

restartBtn.addEventListener('click', () => {
  reset();
  state = 'playing';
});

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
